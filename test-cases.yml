- summary: |
    Запрос ссылки на восстановление пароля
  requirement: |
    При вводе зарегистрированного Email система отправляет инструкцию по сбросу пароля
  prerequisites: |
    Открыта главная страница https://codebattle.hexlet.io/
  test-data: |
    Email = test@test.com
  steps:
    - На главной странице нажать "Sign in"
    - На странице авторизации нажать на ссылку "Forgot your password?"
    - В открывшейся странице ввести корректный Email в появившемся поле
    - Нажать кнопку "Submit"
  expected-result: |
    Появляется уведомление об успешной отправке, на указанный Email приходит письмо со ссылкой

- summary: |
    Сброс пароля по ссылке из письма
  requirement: |
    Ссылка из письма позволяет пользователю установить новый пароль для аккаунта
  prerequisites: |
    Получено письмо для восстановления доступа на Email
  test-data: |
    New Password = NewPassTest1!
  steps:
    - Перейти по ссылке из полученного письма
    - Ввести новый пароль в поле "New password"
    - Нажать "Save"
  expected-result: |
    Пароль успешно изменен

- summary: |
    Авторизация на платформе с новым паролем
  requirement: |
    После изменения пароля пользователь успешно авторизуется
