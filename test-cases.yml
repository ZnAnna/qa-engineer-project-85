    - Выбрать задание
    - Нажать на кнопку "Create a battle" в правом нижнем углу окна
  expected-result: |
    Окно закрывается, платформа перенаправляет пользователя в баттл

- summary: |
    Закрытие окна "Create a battle" без сохранения настроек
  requirement: |
    При нажатии на иконку "крест" дополнительное окно закрывается
  prerequisites: |
    Открыто модальное окно "Create a battle"
  test-data: |
    Empty
  steps:
    - Изменить любой параметр (например, выбрать уровень сложности "2 звезды")
    - Нажать на иконку крестика в правом верхнем углу окна
  expected-result: |
    Модальное окно закрывается, пользователь возвращается на главную страницу личного кабинета, внесенные изменения не сохраняются

- summary: |
    Выбор нескольких тегов одновременно для фильтрации задач
  requirement: |
    Платформа должна поддерживать гибкую фильтрацию задач по нескольким тегам одновременно
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Теги: "math", "strings"
  steps:
    - Нажать на тег "math"
    - Нажать на тег "strings"
  expected-result: |
    Оба тега подсвечиваются как активные, в поле "Choose task" отображается количество задач, которые соответствуют одновременно обоим выбранным критериям

- summary: |
    Отмена выбора ранее активированного тега
  requirement: |
    Система поддерживает сброс тега при повторном нажатии на него
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle", тег "collections" активен
  test-data: |
    Empty
  steps:
    - Повторно нажать на активный тег "collections"
  expected-result: |
    Подсветка с тега "collections" снимается, он переходит в неактивное состояние, счетчик доступных задач возвращается к исходному значению

- summary: |
    Проверка минимального граничного значения в слайдере контроля времени
  requirement: |
    Платформа должна поддерживать разное время контроля за игрой и корректно ограничивать нижний предел
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Смещение ползунка в крайнее левое положение
  steps:
