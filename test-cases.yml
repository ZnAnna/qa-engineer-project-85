- summary: |
    Быстрый старт игры без регистрации через кнопку "Try simple battle"
  requirement: |
    Неавторизованный пользователь может мгновенно запустить тестовый баттл без регистрации
  prerequisites: |
    Открыта главная страница https://codebattle.hexlet.io/
  test-data: |
    Empty
  steps:
    - Нажать на кнопку "Try simple battle"
  expected-result: |
    Пользователь автоматически перенаправляется в интерфейс баттла, минуя форму регистрации

- summary: |
    Выбор уровня сложности (Level) при создании баттла
  requirement: |
    Платформа должна поддерживать различные уровни сложности
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Уровень сложности: "2 звезды"
  steps:
    - Нажать на вторую кнопку в блоке "Level" (с изображением двух звезд)
  expected-result: |
    Выбранная кнопка подсвечивается красным цветом, предыдущий выбор (1 звезда) становится неактивным, количество доступных задач в блоке ниже динамически обновляется

- summary: |
    Выбор типа игры с другом (With a friend)
  requirement: |
    Платформа должна поддерживать различные типы игры (с другим пользователем, с другом, с ботом)
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Empty
  steps:
    - Нажать на кнопку "With a friend" в блоке "Game Type"
  expected-result: |
    Кнопка "With a friend" подсвечивается красной рамкой и шрифтом, остальные типы игры становятся неактивными, появляется дополнительное поле с выбором оппонента

- summary: |
    Изменение времени контроля за игрой с помощью слайдера (Time control)
  requirement: |
    Платформа должна поддерживать разное время контроля за игрой
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Смещение ползунка вправо
  steps:
    - Зажать левой кнопкой мыши круглый ползунок на шкале "Time control"
    - Перетащить его вправо на несколько делений
  expected-result: |
    Ползунок плавно перемещается по шкале, текстовое значение в правом верхнем углу блока (например, "8 min") динамически увеличивается в соответствии с позицией

- summary: |
    Выбор случайной задачи из выпадающего списка (Choose task)
  requirement: |
    Платформа должна поддерживать различные задачи для игры
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Empty
  steps:
    - Нажать на выпадающий список в блоке "Choose task by name or tags"
    - Оставить значение по умолчанию "random task"
  expected-result: |
    Список раскрывается, отображая доступные задачи или опцию случайного выбора, рядом в скобках корректно выводится количество доступных задач (например, "105 available")

- summary: |
    Фильтрация задач по тегу (Tags)
  requirement: |
    Задачи должны фильтроваться в зависимости от выбранного тега
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Тег: "math"
  steps:
    - Нажать на кнопку-тег "math" в блоке "Tags"
  expected-result: |
    Тег "math" визуально выделяется (активируется), а счетчик доступных задач в поле "Choose task" уменьшается, показывая только количество математических задач

- summary: |
    Успешное создание баттла cо случайным пользователем по кнопке "Create battle"
  requirement: |
    Система должна инициализировать игровой процесс cо случайным пользователем на основе выбранных параметров
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Game Type = With other user
  steps:
    - В окне выбрать Level
    - Выбрать Game Type = With other user
    - Установить ползунок Time control
    - Выбрать задание
    - Нажать на кнопку "Create a battle" в правом нижнем углу окна
    - Окно создания баттла автоматически закрывается
    - На странице кнопка "Create a battle" меняет название на "Continue battle"
    - При нажатии на кнопку "Continue battle" открывается информационное окно с ожидаением оппонента и ссылкой для приглашения в баттл
  expected-result: |
    После присоединения соперника автоматически открывается окно баттла

- summary: |
    Успешное создание баттла c другом по кнопке "Create battle"
  requirement: |
    Система должна инициализировать игровой процесс c другом на основе выбранных параметров
  prerequisites: |
    Пользователь авторизован. Открыто окно "Create a battle"
  test-data: |
    Game Type = With a friend
  steps:
    - В окне выбрать Level
    - Выбрать Game Type = With a friend
    - Установить ползунок Time control
    - Выбрать пользователя из выпадающего списка "Choose opponent"
    - Выбрать задание
    - Нажать на кнопку "Create invite" в правом нижнем углу окна
    - Окно создание баттла закрывается автоматически
    - В правом верхнем углу появляется уведомление о направленном приглашении с указанием ника выбранного пользователя и кнопкой Cancel
    - Оппонент получает уведомление с ником приглашающего и кнопками Accept и Decline
    - Оппонент нажимает Accept
  expected-result: |
    После принятия приглашения, автоматически открывается окно баттла

- summary: |
    Успешное создание баттла c ботом по кнопке "Create battle"
  requirement: |
    Система должна инициализировать игровой процесс c ботом на основе выбранных параметров
  prerequisites: |
