    Nickname = HexletTest
  steps:
    - На главной странице нажать на копку "Sign up"
    - Ввести использованный ранее Nickname
    - Ввести Email
    - Ввести пароль
    - Ввести подтверждение пароля
    - Нажать "Submit"
  expected-result: |
    Система показывает сообщение, что Nickname уже используется

