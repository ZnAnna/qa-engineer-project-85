- summary: |
    Регистрация пользователя по email
  requirement: |
    При вводе валидных данных в форму регистрации пользователь успешно регистрируется
  prerequisites: |
    Открыта главная страница https://codebattle.hexlet.io/
  test-data: |
    Nickname Email неиспользованные ранее
  steps:
    - На главной странице нажать на копку "Sign up"
    - На странице регистрации ввести Nickname
    - Ввести Email
    - Ввести пароль
    - Ввести подтверждение пароля
    - Нажать "Submit"
  expected-result: |
    Пользователь успешно зарегистрирован, открывается страница с турнирами, в правом верхнем углу отображается никнейм пользователя

